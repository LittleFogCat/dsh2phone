# dsh2phone plugin patch — machine-specific (absolute entry path).
#   source: cordis.patch.example.yml
#   render: node tools/render-plugin-patch.mjs
# Deployment values (relay URL, pairing URL, tunnel key, DSH app dir) come from
# <repo>/.env via host.js — nothing private belongs in this YAML.
- insert:
    - id: dsh2phone
      # A workspace-linked plugin is not resolvable from the Host's own package
      # tree, so address its entry point directly: the Loader resolves a
      # path-like row by walking up to the nearest package.json, which is this
      # package (client-modules locatePkgJson -> nearestPackage).
      name: 'file:///__DSH2PHONE_HOME__/dsh2phone-dsh-plugin/host.js'
      config: {}
